<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Shop Idle</title>
<!-- installable as a home-screen app (manifest.webmanifest, sw.js; icons drawn by tools/make_icons.py) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1614">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monster Shop">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="skinFonts" href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Colors and fonts come from the active skin (SKINS[].theme sets these same names).
     The defaults here are the Haunted Mall skin, so the first paint looks right before the script runs. */
  :root {
    --bg: #0e1614;            /* page */
    --bg-glow: #163a30;       /* soft light at the top of the page */
    --deep: #08100e;          /* bar tracks and drop shadows */
    --panel: #15201d;         /* shop signs, side panels, cards */
    --edge: #2d4a42;          /* panel borders */
    --chain: #2d4a42;         /* the little chains the shop signs hang from; transparent hides them */
    --accent: #7dffb2;        /* cash, Buy, highlights */
    --accent-dark: #2fa86a;
    --on-accent: #042014;
    --alt: #c7a6ff;           /* Automate, goals, milestone badge */
    --alt-dark: #7a58c0;
    --on-alt: #1a0c33;
    --ink: #e4f5ee;
    --ink-dim: #93b0a6;
    --stat: #e6f07a;          /* the milestone currency in the header */
    --off: #1f2a27;           /* disabled Buy */
    --off-ink: #7a8f88;
    --off-dark: #131c19;
    --alt-off: #2a2438;       /* disabled Automate */
    --alt-off-ink: #9488ac;
    --alt-off-dark: #1a1624;
    --badge-off: #8a78b0;
    --badge-off-dark: #4a3c6a;
    --backdrop: rgba(4, 10, 8, 0.8);
    --tile-s: 45%;            /* shop icon tiles and bars: hsl(shop hue, these) */
    --tile-l: 40%;
    --bar-s: 70%;
    --bar-l: 58%;
    --radius: 14px;
    --display: "Rubik Wet Paint", system-ui, sans-serif;
    --display-weight: 400;
    --body: "Rubik", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 500px at 50% -10%, var(--bg-glow) 0%, transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }

  /* Header: the cash counter is the one loud thing */
  /* The stats row is either always below the cash or always beside it, never switching as numbers grow and shrink */
  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; padding: 8px 0 16px; }
  .brand { flex: 1 1 100%; min-width: 0; }
  @media (min-width: 1000px) { header.top { flex-wrap: nowrap; } .brand { flex: 1 1 auto; } .stats { flex: 0 0 auto; } }
  .cash, .stats b { font-variant-numeric: tabular-nums; }
  .ep-line { margin: 0 0 2px; font-size: 0.85rem; color: var(--ink-dim); display: flex; gap: 10px; }
  .ep-line b { color: var(--accent); font-weight: 700; }
  .brand h1 { font-family: var(--display); font-weight: var(--display-weight); font-size: 1.15rem; margin: 0; color: var(--ink-dim); letter-spacing: 0.02em; }
  .cash { font-family: var(--display); font-weight: var(--display-weight); font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: 1; color: var(--accent); text-shadow: 0 3px 0 var(--accent-dark); margin: 4px 0 0; }
  .cash small { font-size: 0.45em; color: var(--accent-dark); text-shadow: none; margin-left: 6px; }
  .hint { margin: 8px 0 0; padding: 8px 12px; max-width: 34ch; background: var(--accent); color: var(--on-accent); font-weight: 600; border-radius: 12px; font-size: 0.95rem; }
  /* a fixed grid so growing numbers never push an item onto another line: currencies stacked in the first
     column, income, bonus and the sound button in the second */
  .stats { display: grid; grid-template-columns: auto auto; grid-template-rows: repeat(3, auto); grid-auto-flow: column; justify-content: start; align-items: center; gap: 6px 28px; color: var(--ink-dim); font-size: 0.95rem; white-space: nowrap; }
  .stats .sound-btn { justify-self: start; }
  @media (max-width: 559px) { .stats { grid-template-columns: 1fr 1fr; gap: 6px 16px; } }
  .stats b { color: var(--ink); font-weight: 700; }
  .stats { align-items: center; }
  /* a compact toggle exactly one text line tall, so its row is no taller than the others */
  .sound-btn { height: calc(0.95rem * 1.45); padding: 0 8px; font-size: 0.78rem; line-height: 1; border-width: 1.5px; border-radius: 8px; display: inline-flex; align-items: center; }
  /* fast taps on phones shouldn't zoom the page or flash a gray highlight */
  button, .bar { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .stats .stat b { color: var(--stat); }

  .layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } }

  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--ink-dim); font-size: 0.95rem; }
  .seg { display: inline-flex; border: 2px solid var(--edge); border-radius: 999px; overflow: hidden; }
  .seg button { background: transparent; border: 0; padding: 4px 14px; font-weight: 600; color: var(--ink-dim); }
  .seg button[aria-pressed="true"] { background: var(--edge); color: var(--ink); }

  /* Shop signs */
  .signs { display: flex; flex-direction: column; gap: 14px; }
  .sign {
    --hue: 100;
    position: relative;
    background: var(--panel);
    border: 3px solid var(--edge);
    border-radius: var(--radius);
    padding: 12px 14px 14px;
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 4px 12px;
    box-shadow: 0 6px 0 var(--deep);
  }
  /* hanging chains */
  .sign::before, .sign::after {
    content: ""; position: absolute; top: -13px; width: 4px; height: 12px; background: var(--chain); border-radius: 2px;
  }
  .sign::before { left: 26px; }
  .sign::after { right: 26px; }
  .sign.locked { opacity: 0.55; grid-template-columns: 60px 1fr; }
  .icon {
    grid-row: span 3; width: 60px; height: 60px; border-radius: 12px; border: 0;
    font-size: 2rem; display: grid; place-items: center;
    /* raised, brightly colored so it reads as a button like Buy and Automate */
    background: hsl(var(--hue) var(--tile-s) var(--tile-l));
    box-shadow: 0 4px 0 hsl(var(--hue) var(--tile-s) calc(var(--tile-l) - 26%)), inset 0 2px 0 rgba(255, 255, 255, 0.3);
    cursor: pointer;
    transition: transform 80ms, box-shadow 80ms;
    align-self: start;
    margin-bottom: 4px;
  }
  .icon:hover:not(:disabled) { background: hsl(var(--hue) var(--tile-s) calc(var(--tile-l) + 6%)); }
  .icon:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 transparent, inset 0 2px 0 rgba(255, 255, 255, 0.3); }
  /* automated or locked: nothing to tap, so it looks flat and quiet */
  .icon:disabled { cursor: default; background: hsl(var(--hue) 25% 30%); box-shadow: inset 0 -4px 0 hsl(var(--hue) 25% 20%); filter: saturate(0.7); }
  .sign h3 { margin: 0; font-family: var(--display); font-weight: var(--display-weight); font-size: 1.15rem; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .sign h3 .n { color: var(--accent); font-size: 1rem; white-space: nowrap; }
  /* phones: shop name on its own line, customer count underneath */
  @media (max-width: 560px) { .sign h3 { flex-direction: column; align-items: flex-start; gap: 0; } }
  .bar { cursor: pointer; height: 18px; background: var(--deep); border-radius: 999px; overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: hsl(var(--hue) var(--bar-s) var(--bar-l)); border-radius: 999px; }
  .bar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; grid-column: 2; }
  .meta .info { font-size: 0.85rem; color: var(--ink-dim); flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .meta .info b { color: var(--ink); }
  /* progress toward the next milestone */
  .mbar { height: 6px; max-width: 220px; margin-top: 5px; background: var(--deep); border-radius: 999px; overflow: hidden; }
  .mbar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .buys { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 7px 12px; font-weight: 700;
    box-shadow: 0 3px 0 var(--accent-dark); transition: transform 80ms, box-shadow 80ms;
  }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--accent-dark); }
  /* Raised buttons move down 3-4px when pressed. Stretch the hit area over the ledge below and the gap left above,
     so a press anywhere on what looks like the button lands on it; child spans never become the press target. */
  .btn, .icon { position: relative; }
  .btn::after, .icon::after { content: ""; position: absolute; inset: -4px 0; }
  .btn > *, .icon > * { pointer-events: none; }
  .btn:disabled { background: var(--off); color: var(--off-ink); box-shadow: 0 3px 0 var(--off-dark); cursor: not-allowed; }
  .btn.alt { background: var(--alt); box-shadow: 0 3px 0 var(--alt-dark); color: var(--on-alt); }
  .btn.alt:disabled { background: var(--alt-off); color: var(--alt-off-ink); box-shadow: 0 3px 0 var(--alt-off-dark); }
  .btn .sub { display: block; font-size: 0.75rem; font-weight: 600; opacity: 0.8; }
  .btn.buy .sub { font-weight: 700; opacity: 1; }
  /* what a purchase adds; the corner badge marks purchases that cross a milestone */
  .btn .gain { display: block; font-size: 0.72rem; font-weight: 600; opacity: 0.8; white-space: nowrap; }
  .btn .badge {
    position: absolute; top: -9px; right: -7px; background: var(--alt); color: var(--on-alt); border-radius: 999px;
    padding: 0 6px; font-size: 0.72rem; font-weight: 700; line-height: 1.5; box-shadow: 0 2px 0 var(--alt-dark);
  }
  .btn:disabled .badge { background: var(--badge-off); box-shadow: 0 2px 0 var(--badge-off-dark); }
  .auto-tag { color: var(--alt); font-weight: 700; font-size: 0.9rem; }
  .locked-msg { grid-column: 2; color: var(--ink-dim); margin: 0; }

  /* Side panel */
  aside { display: flex; flex-direction: column; gap: 16px; }
  .panel { background: var(--panel); border: 3px solid var(--edge); border-radius: var(--radius); padding: 14px; }
  .panel h2 { font-family: var(--display); font-weight: var(--display-weight); font-size: 1.15rem; margin: 0 0 8px; }
  .goal { margin: 0 0 10px; }
  .goal .gbar { height: 8px; background: var(--deep); border-radius: 999px; margin-top: 4px; overflow: hidden; }
  .goal .gbar i { display: block; height: 100%; background: var(--alt); }
  .goal .label { font-size: 0.92rem; display: flex; justify-content: space-between; gap: 8px; }
  .goal .label span:last-child { color: var(--ink-dim); white-space: nowrap; }
  .panel p { margin: 0 0 10px; font-size: 0.92rem; color: var(--ink-dim); }
  .panel p b { color: var(--ink); }
  .finale .btn { width: 100%; padding: 10px; }
  .small-btn { background: transparent; border: 2px solid var(--edge); border-radius: 10px; padding: 4px 10px; color: var(--ink-dim); font-size: 0.85rem; }
  .small-btn:hover { color: var(--ink); border-color: var(--ink-dim); }
  .skin-pick { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 0.92rem; color: var(--ink-dim); }
  .vol { display: grid; grid-template-columns: 5.5em 1fr; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 0.92rem; color: var(--ink-dim); }
  .vol input { width: 100%; margin: 0; accent-color: var(--accent); }
  .skin-pick select { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--deep); border: 2px solid var(--edge); border-radius: 10px; padding: 4px 8px; }

  /* Cards and chests */
  .views { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .views .seg button { padding: 6px 18px; }
  .views .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
  .chests { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
  @media (min-width: 560px) { .chests { grid-template-columns: repeat(3, 1fr); } }
  .chest { background: var(--panel); border: 3px solid var(--edge); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .chest h3 { margin: 0; font-family: var(--display); font-weight: var(--display-weight); font-size: 1.05rem; }
  .chest p { margin: 0; font-size: 0.85rem; color: var(--ink-dim); flex: 1; }
  .pull { min-height: 64px; margin-bottom: 14px; padding: 10px 12px; border: 2px dashed var(--edge); border-radius: var(--radius); color: var(--ink-dim); font-size: 0.92rem; }
  .pull ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .pull li { background: var(--deep); border-radius: 999px; padding: 4px 12px; color: var(--ink); font-weight: 600; }
  .pull li em { font-style: normal; color: var(--accent); margin-left: 6px; }
  .cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }   /* six cards: rows of 1, 2 or 3 all come out even */
  .card { --hue: 100; background: var(--panel); border: 3px solid var(--edge); border-radius: var(--radius); padding: 12px; display: grid; grid-template-columns: 56px 1fr; gap: 4px 12px; align-content: start; }
  .card.none { opacity: 0.6; }
  .card.max { border-color: var(--accent); }
  .card .portrait { grid-row: span 2; width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-size: 1.9rem; background: hsl(var(--hue) var(--tile-s) 26%); box-shadow: inset 0 -4px 0 hsl(var(--hue) var(--tile-s) 18%); }
  .card h3 { margin: 0; font-family: var(--display); font-weight: var(--display-weight); font-size: 1.05rem; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .card h3 .lv { color: var(--accent); font-size: 0.95rem; white-space: nowrap; }
  .card .role { font-size: 0.82rem; color: var(--ink-dim); }
  .card .copies { grid-column: 1 / -1; }
  .card .copies .gbar { height: 8px; background: var(--deep); border-radius: 999px; overflow: hidden; }
  .card .copies .gbar i { display: block; height: 100%; background: hsl(var(--hue) var(--bar-s) var(--bar-l)); }
  .card .copies span { font-size: 0.8rem; color: var(--ink-dim); }
  .card .perk { grid-column: 1 / -1; font-size: 0.88rem; margin: 0; }
  .card .perk b { color: var(--alt); }
  .card .perk small { display: block; color: var(--ink-dim); font-size: 0.8rem; }

  dialog#story { border: 3px solid var(--edge); border-radius: var(--radius); background: var(--panel); color: var(--ink); padding: 20px 22px; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-x: hidden; overflow-y: auto; overflow-wrap: anywhere; box-shadow: 0 8px 0 var(--deep); }
  dialog#story .scene { margin: -20px -22px 14px; line-height: 0; border-bottom: 3px solid var(--edge); }
  dialog#story .scene svg { display: block; width: 100%; height: auto; }
  .card .portrait.drawn { overflow: hidden; }
  .card .portrait.drawn svg { display: block; width: 100%; height: 100%; }
  .card .portrait.unknown svg { filter: brightness(0.12) saturate(0); }
  dialog#story::backdrop { background: var(--backdrop); }
  dialog#story h2 { font-family: var(--display); font-weight: var(--display-weight); font-size: 1.4rem; margin: 0 0 10px; color: var(--accent); }
  dialog#story p { margin: 0 0 10px; line-height: 1.55; }
  dialog#story b { color: var(--accent); }
  dialog#story .big-cash { display: block; margin: 2px 0 6px; font-family: var(--display); font-weight: var(--display-weight); font-size: 2rem; color: var(--accent); line-height: 1.2; }
  .story-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 30px); opacity: 0;
    background: var(--accent); color: var(--on-accent); font-weight: 700; padding: 10px 16px; border-radius: 12px;
    max-width: calc(100vw - 32px); text-align: center; transition: opacity 200ms, transform 200ms; pointer-events: none;
    box-shadow: 0 4px 0 var(--accent-dark);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .pop { position: fixed; pointer-events: none; font-family: var(--display); font-weight: var(--display-weight); color: var(--accent); text-shadow: 0 2px 0 var(--accent-dark); animation: pop 800ms ease-out forwards; z-index: 5; }
  @keyframes pop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }
  @media (prefers-reduced-motion: reduce) {
    .pop { animation: none; opacity: 0; }
    .toast, .btn, .icon { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <p class="ep-line"><b id="epNum">Episode 1</b><span id="epPrices" hidden></span></p>
      <h1 id="episodeName">Grizzle's Haunted Mall</h1>
      <div class="cash" id="cash">$0</div>
      <p class="hint" id="hint" hidden></p>
    </div>
    <div class="stats">
      <span class="stat"><span id="beerLabel">Beer</span> <b id="beer">0</b></span>
      <span><span id="eggsLabel">Eggs</span> <b id="eggs">0</b></span>
      <span><span id="crystalsLabel">Crystals</span> <b id="crystals">0</b></span>
      <span>Income <b id="ips">$0/s</b></span>
      <span>Permanent bonus <b id="perm">x1</b></span>
      <button class="small-btn sound-btn" id="soundBtn"></button>
    </div>
  </header>

  <div class="layout">
    <main>
      <div class="views">
        <div class="seg" role="group" aria-label="View">
          <button data-view="shops" aria-pressed="true">Shops</button>
          <button data-view="cards" aria-pressed="false">Cards<i class="dot" id="cardDot" hidden></i></button>
        </div>
        <div class="toolbar" id="buyBar">
          <span>Buy</span>
          <div class="seg" role="group" aria-label="Buy amount">
            <button data-mode="1" aria-pressed="true">x1</button>
            <button data-mode="10" aria-pressed="false">x10</button>
            <button data-mode="max" aria-pressed="false">Max</button>
          </div>
        </div>
      </div>
      <div class="signs" id="signs"></div>
      <section id="cardsView" hidden aria-label="Cards and chests">
        <div class="chests" id="chests"></div>
        <div class="pull" id="pull" aria-live="polite"></div>
        <div class="cardgrid" id="cardgrid"></div>
      </section>
    </main>

    <aside>
      <section class="panel" aria-labelledby="goalsH">
        <h2 id="goalsH">Goals</h2>
        <div id="goals"></div>
        <p id="goalsNote"></p>
      </section>
      <section class="panel finale" aria-labelledby="finH">
        <h2 id="finH">Episode finale</h2>
        <p id="finText"></p>
        <button class="btn alt" id="finBtn" disabled>Locked</button>
      </section>
      <section class="panel">
        <label class="skin-pick">Setting <select id="skinSel"></select></label>
        <label class="vol">Effects <input type="range" id="fxVol" min="0" max="100" step="5"></label>
        <label class="vol">Ambience <input type="range" id="ambVol" min="0" max="100" step="5"></label>
        <p id="offlineNote">Automated shops keep earning while you're away.</p>
        <button class="small-btn" id="resetBtn">Wipe save</button>
      </section>
    </aside>
  </div>
</div>
<dialog id="story" aria-labelledby="storyTitle">
  <div class="scene" id="storyArt" hidden></div>
  <h2 id="storyTitle"></h2>
  <div id="storyText"></div>
  <div class="story-actions" id="storyActions"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  // ---------- Mechanics (numbers only; everything players read lives in SKINS below) ----------
  // The numbers behind the six shop slots. Names, icons and colors per shop come from the skin's episodes.
  const SCHEMES = [
    { base: 4,       growth: 1.07, payout: 1,      time: 1,  auto: 500 },
    { base: 60,      growth: 1.15, payout: 60,     time: 3,  auto: 5e3 },
    { base: 1000,    growth: 1.14, payout: 540,    time: 6,  auto: 5e4 },
    { base: 20000,   growth: 1.13, payout: 4320,   time: 12, auto: 5e5 },
    { base: 300000,  growth: 1.12, payout: 51840,  time: 24, auto: 5e6 },
    { base: 4000000, growth: 1.11, payout: 622080, time: 96, auto: 5e7 },
  ];
  const MILESTONES = [10, 25, 50, 100, 150];   // each doubles that scheme's income and gives 1 of the milestone currency
  const PERM_PER_EPISODE = 0.5;                 // each finale multiplies the permanent bonus by 1.5 (the finale card boosts this); multiplying keeps pace with the growing costs
  const EPISODE_COST_GROWTH = 2.5;              // costs x2.5 per finished episode (x2.5, x6.25, x15.6...): customers, automation, cash goals
  const OFFLINE_CAP_S = 8 * 3600;               // shops earn for at most this long while the tab is closed

  // Cards: permanent, survive episode resets. Copies needed for levels 1..5 (cumulative).

  // ---------- Actions ----------
  function unlocked(i) { return i === 0 || S.schemes[i - 1].n >= 1; }

  function buy(i) {
    const k = buyCount(i);
    const cost = bulkCost(i, k);
    if (S.cash < cost) return;
    const before = S.schemes[i].n;
    S.cash -= cost;
    S.schemes[i].n += k;
    const crossed = MILESTONES.filter(m => before < m && S.schemes[i].n >= m).length;
    sfx(crossed ? "milestone" : "buy");
    if (crossed) {
      const had = Math.floor(S.beer);
      S.beer = Math.round((S.beer + crossed * (1 + cardBonus("beer"))) * 100) / 100;   // the beer card adds fractions; they add up
      const got = Math.floor(S.beer) - had;
      toast(shop(i).name + ": income x" + +Math.pow(2 + cardBonus("milestone"), crossed).toFixed(2) + (got ? " and +" + got + " " + cur("beer", got) : ""));
    }
    render();
  }
  function automate(i) {
    const sc = S.schemes[i];
    if (isAuto(i) || S.cash < autoCost(i) || sc.n < 1) return;
    S.cash -= autoCost(i);
    sc.auto = true;
    sfx("automate");
    if (!sc.running) sc.running = true;
    render();
  }
  function tap(i, ev) {
    const sc = S.schemes[i];
    if (sc.n < 1 || isAuto(i) || sc.running) return;
    sc.running = true;
    sfx("tap", i);
  }

  // ---------- Chests ----------
  function pickCard() {
    const total = CARDS.reduce((a, c) => a + c.weight, 0);
    let roll = Math.random() * total;
    for (const c of CARDS) { roll -= c.weight; if (roll < 0) return c; }
    return CARDS[0];
  }
  function openChest(id) {
    const ch = CHESTS.find(c => c.id === id);
    if (!ch || S[ch.cur] < ch.cost) return;
    S[ch.cur] -= ch.cost;
    const got = [];
    for (let k = 0; k < ch.pulls; k++) {
      const c = pickCard();
      const before = cardLevel(c.id);
      if (copies(c.id) >= LEVEL_AT[MAX_LEVEL - 1]) { S.crystals += 1; got.push({ c, tag: "+1 " + cur("crystals", 1) }); continue; }
      S.cards[c.id] = copies(c.id) + 1;
      const after = cardLevel(c.id);
      got.push({ c, tag: before === 0 ? "new" : after > before ? "level " + after : "" });
    }
    S.schemes.forEach((sc, i) => { if (isAuto(i) && sc.n > 0) sc.running = true; });
    sfx("chest", got);
    $("pull").innerHTML = "<ul>" + got.map(g => `<li>${cast(g.c).icon} ${cast(g.c).name}${g.tag ? `<em>${g.tag}</em>` : ""}</li>`).join("") + "</ul>";
    renderCards();
    render();
  }

    return clearedCount() >= GOALS_NEEDED && S.schemes[SCHEMES.length - 1].n >= 1;
  }

    if (!finaleReady()) return;
    const next = fresh();
    next.episode = S.episode + 1;
    next.perm = S.perm * (1 + finaleGain());
    next.beer = S.beer;
    next.eggs = S.eggs + EGGS_PER_FINALE;
    next.crystals = S.crystals;
    next.cards = S.cards;
    S = next;
    sfx("finale");
    save();
    build();
    maybeShowIntro();
  }

  const storyQueue = [];   // drained by the dialog's close listener in Wiring

    const { title, text, actions, art } = story;
    $("storyArt").innerHTML = art || "";
    $("storyArt").hidden = !art;
    $("storyTitle").textContent = title;
    $("storyText").innerHTML = text.map(t => "<p>" + t + "</p>").join("");

    box.innerHTML = "";

      const b = document.createElement("button");
      b.className = k === 0 ? "btn alt" : "small-btn";
      b.textContent = a.label;
      b.addEventListener("click", () => { $("story").close(); if (a.run) a.run(); });
      box.appendChild(b);

  }
  function maybeShowIntro() {
    if (S.storySeen >= S.episode) return;
    S.storySeen = S.episode;
    save();
    showStory({
      title: "Episode " + (S.episode + 1) + ": " + episodeName(),
      text: EP().intro,
      art: sceneArt(),
      actions: [{ label: "Open for business" }],
    });
  }
  function openFinale() {
    if (!finaleReady()) return;
    const f = EP().finale;
    showStory({
      title: f.title,
      text: f.text.concat(["<b>Reward:</b> +" + Math.round(finaleGain() * 100) + "% permanent income and " + EGGS_PER_FINALE + " " + cur("eggs", EGGS_PER_FINALE) + ". Next stop: " + nameOf(S.episode + 1) + "."]),
      art: sceneArt(),
      actions: [{ label: "Start " + nameOf(S.episode + 1), run: finish }, { label: "Not yet" }],
    });
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1) * SPEED;
    last = now;
    for (let i = 0; i < SCHEMES.length; i++) {
      const sc = S.schemes[i];
      const auto = isAuto(i);
      if (auto && !sc.running && sc.n >= 1) sc.running = true;
      if (!sc.running || sc.n < 1) continue;
      sc.progress += dt / runTime(i);
      if (sc.progress >= 1) {
        const runs = auto ? Math.floor(sc.progress) : 1;
        S.cash += runIncome(i) * runs;
        if (!auto) sfx("cash", i);
        sc.progress = auto ? sc.progress - runs : 0;
        sc.running = auto;
      }
    }
    checkGoals();
    update();
    requestAnimationFrame(frame);
  }

  function checkGoals() {
    for (const g of GOALS) {
      if (!S.goalsDone.includes(g.id) && g.cur(S) >= goalTarget(g)) {
        S.goalsDone.push(g.id);
        S.eggs += EGGS_PER_GOAL;
        sfx("goal");
        toast("Goal cleared: " + goalText(g) + " (+" + EGGS_PER_GOAL + " " + cur("eggs", EGGS_PER_GOAL) + ")");
        renderGoals();
      }
    }
  }

  // ---------- Offline ----------
  const WELCOME_AFTER_S = 5 * 60;   // away this long gets the welcome-back popup; shorter breaks just get a toast
  const fmtAway = s => {
    const [n, unit] = s >= 3600 ? [+(s / 3600).toFixed(1), "hour"] : [Math.max(1, Math.round(s / 60)), "minute"];
    return n + " " + unit + (n === 1 ? "" : "s");
  };
  function offline() {
    const away = (Date.now() - (S.seen || Date.now())) / 1000;
    const secs = Math.min(away, offlineCap());
    if (secs < 30) return;
    let gain = 0;
    SCHEMES.forEach((_, i) => { if (isAuto(i)) gain += perSecond(i) * secs; });
    S.cash += gain;
    if (away < WELCOME_AFTER_S) { if (gain > 0) toast("Welcome back. Your shops earned " + money(gain) + " in " + fmtAway(secs)); return; }
    welcomeBack(away, gain);
  }
  function welcomeBack(away, gain) {
    const text = gain > 0
      ? ["You were away for " + fmtAway(away) + ". Your automated shops earned <span class=\"big-cash\">" + money(gain) + "</span>"]
      : ["You were away for " + fmtAway(away) + ". Only automated shops earn while you're away, so automate one to come back to cash."];
    if (gain > 0 && away > offlineCap()) text.push("Shops earn for up to " + offlineCap() / 3600 + " hours while you're away, so that's where they stopped.");
    const ready = CHESTS.filter(c => S[c.cur] >= c.cost).map(c => "<b>" + SK.chests[c.id].name + "</b>");
    if (ready.length) text.push("Ready to open: " + (ready.length > 1 ? ready.slice(0, -1).join(", ") + " and " : "") + ready[ready.length - 1] + ".");
    if (finaleReady()) text.push("The <b>finale</b> is ready. " + EP().finale.ready);
    const actions = [{ label: gain > 0 ? "Collect " + money(gain) : "Back to work", run: () => sfx(gain > 0 ? "milestone" : "buy") }];
    if (ready.length) actions.push({ label: "Open chests", run: () => document.querySelector('[data-view="cards"]').click() });
    showStory({ title: "Welcome back", text, actions });
  }

  // ---------- Rendering ----------
  const $ = id => document.getElementById(id);
  const signsEl = $("signs");
  let rows = [];

  function build() {
    $("episodeName").textContent = SK.owner + "'s " + episodeName();
    document.title = SK.owner + "'s " + episodeName() + " · Monster Shop Idle";
    $("epNum").textContent = "Episode " + (S.episode + 1);
    // later episodes cost more (see costMult); say so, so the higher prices have a visible reason
    const cm = costMult();
    $("epPrices").hidden = S.episode === 0;
    $("epPrices").textContent = "Prices x" + (cm < 1000 ? +cm.toPrecision(3) : fmt(cm));
    signsEl.innerHTML = "";
    rows = SCHEMES.map((sc, i) => {
      const el = document.createElement("article");
      el.className = "sign";
      el.style.setProperty("--hue", SK.hues[i]);
      el.innerHTML = `
        <button class="icon" aria-label="Run ${shop(i).name}"></button>
        <h3><span class="nm"></span><span class="n"></span></h3>
        <div class="bar"><i></i><span></span></div>
        <div class="meta">
          <div class="info"></div>
          <div class="buys">
            <button class="btn buy"></button>
            <button class="btn alt auto"></button>
          </div>
        </div>
        <p class="locked-msg" hidden></p>`;
      signsEl.appendChild(el);
      const r = {
        el, icon: el.querySelector(".icon"), nm: el.querySelector(".nm"), n: el.querySelector(".n"),
        fill: el.querySelector(".bar i"), label: el.querySelector(".bar span"), info: el.querySelector(".info"),
        buy: el.querySelector(".buy"), auto: el.querySelector(".auto"), locked: el.querySelector(".locked-msg"),
        meta: el.querySelector(".meta"), bar: el.querySelector(".bar"),
      };
      r.icon.addEventListener("click", ev => tap(i, ev));
      r.bar.addEventListener("click", ev => tap(i, ev));
      r.bar.setAttribute("role", "button");
      r.bar.tabIndex = 0;
      r.bar.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); tap(i, ev); } });
      r.buy.addEventListener("click", () => buy(i));
      r.auto.addEventListener("click", () => automate(i));
      return r;
    });
    renderGoals();
    renderCards();
    render();
  }

  // ---------- Cards view ----------
  function buildChests() {
    $("chests").innerHTML = CHESTS.map(c => `
      <div class="chest">
        <h3>${SK.chests[c.id].name}</h3>
        <p>${SK.chests[c.id].blurb} Draws ${c.pulls} cards.</p>
        <button class="btn alt" data-chest="${c.id}">Open<span class="sub">${c.cost} ${cur(c.cur, c.cost)}</span></button>
      </div>`).join("");
    $("chests").querySelectorAll("[data-chest]").forEach(b => b.addEventListener("click", () => openChest(b.dataset.chest)));
  }
  function updateChests() {
    let any = false;
    CHESTS.forEach(c => {
      const b = document.querySelector(`[data-chest="${c.id}"]`);
      if (!b) return;
      const can = S[c.cur] >= c.cost;
      b.disabled = !can;
      any = any || can;
    });
    $("cardDot").hidden = !any;
  }
  function renderCards() {
    $("cardgrid").innerHTML = CARDS.map(cast).map(c => {
      const n = copies(c.id), lv = cardLevel(c.id), max = lv >= MAX_LEVEL;
      const lo = lv ? LEVEL_AT[lv - 1] : 0, hi = max ? lo : LEVEL_AT[lv];
      const pct = max ? 100 : ((n - lo) / (hi - lo)) * 100;
      const now = lv ? c.perk(lv) : "Not found yet";
      const next = max ? "Max level" : `Next: ${c.perk(lv + 1)}`;
      const art = cardArt(c.id);   // drawn portrait if the skin has one; cards not found yet show it as a silhouette
      return `<article class="card${lv ? "" : " none"}${max ? " max" : ""}" style="--hue:${c.hue}">
        <div class="portrait${art ? " drawn" : ""}${lv ? "" : " unknown"}">${art || (lv ? c.icon : "❔")}</div>
        <h3><span>${c.name}</span><span class="lv">${lv ? "Level " + lv : ""}</span></h3>
        <div class="role">${c.role}</div>
        <div class="copies"><div class="gbar"><i style="width:${pct}%"></i></div><span>${max ? n + " copies" : `${n} of ${hi} copies`}</span></div>
        <p class="perk"><b>${now}</b><small>${next}</small></p>
      </article>`;
    }).join("");
  }

  function renderGoals() {
    const active = GOALS.filter(g => !S.goalsDone.includes(g.id)).slice(0, 3);
    $("goals").innerHTML = active.map(g => {
      const target = goalTarget(g), cur = Math.min(g.cur(S), target);
      return `<div class="goal" data-id="${g.id}"><div class="label"><span>${goalText(g)}</span><span>${fmt(cur)} / ${fmt(target)}</span></div><div class="gbar"><i style="width:${(cur / target) * 100}%"></i></div></div>`;
    }).join("") || "<p>All goals cleared.</p>";
    $("goalsNote").innerHTML = `Cleared <b>${clearedCount()}</b> of the <b>${GOALS_NEEDED}</b> needed to open the finale.`;
  }

  function render() {
    S.schemes.forEach((sc, i) => {
      const r = rows[i], def = SCHEMES[i];
      const open = unlocked(i);
      r.el.classList.toggle("locked", !open);
      r.nm.textContent = open ? shop(i).name : "Locked shop";
      r.icon.textContent = open ? shop(i).icon : "🔒";
      r.icon.disabled = !open || isAuto(i);
      r.meta.hidden = r.bar.hidden = !open;
      r.locked.hidden = open;
      r.locked.textContent = open ? "" : "Get one " + uncap(shop(i - 1).name) + " " + customers(1) + " to unlock.";
      r.n.textContent = open ? sc.n + " " + customers(sc.n) : "";
    });
    update(true);
  }

  // cheap per-frame update: bars, cash, button states
  function update(force) {
    $("cash").textContent = money(S.cash);
    $("beer").textContent = Math.floor(S.beer);
    $("eggs").textContent = S.eggs;
    $("crystals").textContent = S.crystals;
    $("perm").textContent = "x" + (S.perm < 100 ? S.perm.toFixed(1) : fmt(S.perm));
    $("offlineNote").textContent = "Automated shops keep earning while you're away (up to " + offlineCap() / 3600 + " hours).";
    updateChests();
    const s0 = S.schemes[0];
    $("hint").textContent = "Tap the " + uncap(shop(0).name) + " (the icon or its bar) to earn your first dollars. Every $1 gets you closer to a second " + customers(1) + ".";
    $("hint").hidden = !(s0.n === 1 && !isAuto(0) && S.cash < nextCost(0) && S.episode === 0);
    let total = 0;
    S.schemes.forEach((sc, i) => {
      const r = rows[i], def = SCHEMES[i];
      if (!unlocked(i)) return;
      const auto = isAuto(i);
      if (auto) total += perSecond(i);
      const fast = auto && runTime(i) / SPEED < 0.25;
      r.fill.style.width = ((fast ? 1 : sc.progress) * 100) + "%";
      const income = runIncome(i);
      r.label.textContent = sc.n < 1 ? "Get a " + customers(1) + " to open" : auto ? money(perSecond(i)) + "/s" : (sc.running ? money(income) : "Tap to run: " + money(income));
      const k = buyCount(i), cost = bulkCost(i, k);
      const nextM = MILESTONES.find(m => m > sc.n);
      const prevM = MILESTONES.filter(m => m <= sc.n).pop() || 0;
      setHTML(r.info, `<span>Runs every <b>${fmtTime(runTime(i))}</b></span>`
        + (nextM ? `<span>Next bonus at <b>${nextM}</b> · ${nextM - sc.n} to go</span>` : "<span>All bonuses earned</span>")
        + `<span class="mbar"><i style="width:${nextM ? ((sc.n - prevM) / (nextM - prevM)) * 100 : 100}%"></i></span>`);
      // what this purchase adds: $/s once automated, per run while tapped by hand
      const added = incomeAt(i, sc.n + k) - income;
      const crossed = MILESTONES.filter(m => sc.n < m && sc.n + k >= m).length;
      const gain = "+" + (auto ? money(added / runTime(i)) + "/s" : money(added) + "/run");
      const badge = crossed ? `<span class="badge">x${+Math.pow(2 + cardBonus("milestone"), crossed).toFixed(2)}</span>` : "";
      setHTML(r.buy, `Buy x${k}<span class="sub">${money(cost)}</span><span class="gain">${gain}</span>${badge}`);
      r.buy.disabled = S.cash < cost;
      if (auto) r.auto.hidden = true;
      else { r.auto.hidden = false; setHTML(r.auto, `Automate<span class="sub">${money(autoCost(i))}</span>`); r.auto.disabled = S.cash < autoCost(i) || sc.n < 1; }
      r.n.textContent = sc.n + " " + customers(sc.n) + (auto ? " · auto" : "");
    });
    $("ips").textContent = money(total) + "/s";
    // finale
    const ready = finaleReady();
    const btn = $("finBtn");
    btn.disabled = !ready;
    const nextEp = nameOf(S.episode + 1);
    btn.textContent = ready ? EP().finale.button : "Locked";
    $("finText").innerHTML = ready
      ? `${EP().finale.ready} Finishing the episode resets your cash and shops, adds <b>+${Math.round(finaleGain() * 100)}%</b> permanent income and <b>${EGGS_PER_FINALE} ${cur("eggs", EGGS_PER_FINALE)}</b>, and moves on to <b>${nextEp}</b>. You keep your ${cur("beer", 2)}, ${cur("eggs", 2)}, ${cur("crystals", 2)} and cards.`
      : "Still needed: " + [
          clearedCount() < GOALS_NEEDED ? `${GOALS_NEEDED - clearedCount()} more goal${GOALS_NEEDED - clearedCount() > 1 ? "s" : ""}` : "",
          S.schemes[SCHEMES.length - 1].n < 1 ? "a " + EP().lease : "",
        ].filter(Boolean).join(" and ") + ".";
    // refresh goal progress a few times a second, not every frame
    const t = Math.floor(performance.now() / 250);
    if (force || t !== update.t) { update.t = t; renderGoals(); }
  }

  let toastTimer;
  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
  }

  function applySkin() {
    const root = document.documentElement.style;
    for (const [k, v] of Object.entries(SK.theme)) if (k !== "fonts") root.setProperty("--" + k, v);
    $("skinFonts").href = SK.theme.fonts;
    document.querySelector('meta[name="theme-color"]').content = SK.theme.bg;   // phone status bar and app title bar
    for (const key of ["beer", "eggs", "crystals"]) $(key + "Label").textContent = cap(cur(key, 2));
    $("pull").textContent = "Open one to draw cards. Duplicates level a card up.";
    $("skinSel").value = SK.id;
  }
  function setSkin(id) {
    SK = skinById(id) || SKINS[0];
    try { localStorage.setItem(SKIN_KEY, SK.id); } catch {}
    applySkin(); build(); buildChests();
    if (amb) startAmbience();
  }

  // ---------- Wiring ----------
  $("skinSel").innerHTML = SKINS.map(k => `<option value="${k.id}">${k.name}</option>`).join("");
  $("skinSel").addEventListener("change", e => setSkin(e.target.value));
  const showBuyMode = () => document.querySelectorAll("#buyBar .seg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === buyMode));
  document.querySelectorAll("#buyBar .seg button").forEach(b => b.addEventListener("click", () => {
    buyMode = b.dataset.mode;
    try { localStorage.setItem(PREF_KEY, buyMode); } catch {}
    showBuyMode();
    update(true);
  }));
  showBuyMode();
  const VIEW_KEY = "grizzle-haunted-mall-view";
  function setView(view) {
    const cards = view === "cards";
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === (cards ? "cards" : "shops")));
    $("signs").hidden = cards;
    $("buyBar").hidden = cards;
    $("cardsView").hidden = !cards;
  }
  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => {
    setView(b.dataset.view);
    try { localStorage.setItem(VIEW_KEY, b.dataset.view); } catch {}
  }));
  try { setView(localStorage.getItem(VIEW_KEY)); } catch { setView("shops"); }
  $("finBtn").addEventListener("click", openFinale);
  $("story").addEventListener("close", () => { if (storyQueue.length) setTimeout(() => showStory(storyQueue.shift()), 150); });
  const showSound = () => { $("soundBtn").textContent = soundOn ? "🔊 Sound on" : "🔇 Sound off"; $("soundBtn").setAttribute("aria-pressed", soundOn); };
  $("soundBtn").addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); } catch {}
    showSound();
    if (soundOn) { unlockAudio(); sfx("buy"); } else stopAmbience();
  });
  showSound();
  for (const [id, key] of [["fxVol", "fx"], ["ambVol", "amb"]]) {
    $(id).value = levels[key];
    $(id).addEventListener("input", e => {
      const was = levels[key];
      levels[key] = +e.target.value;
      try { localStorage.setItem(VOL_KEY, JSON.stringify(levels)); } catch {}
      setVolumes();
      if (key === "amb" && !was !== !levels.amb) levels.amb ? startAmbience() : stopAmbience();
    });
    $(id).addEventListener("change", () => { if (key === "fx") sfx("buy"); });   // a sample at the new level
  }
  $("resetBtn").addEventListener("click", () => {
    if (confirm("Wipe your save and start over?")) {
      try { localStorage.removeItem(SAVE_KEY); } catch {}
      S = fresh(); build(); maybeShowIntro();
    }
  });
  addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { save(); stopAmbience(); return; }
    startAmbience();
    // browsers pause the game loop in background tabs, so credit the time away (S.seen was saved on hide)
    last = performance.now();
    offline();
    S.seen = Date.now();
    render();
  });
  setInterval(save, 5000);

  applySkin();
  offline();
  // resume any automated shops
  S.schemes.forEach((sc, i) => { if (isAuto(i) && sc.n > 0) sc.running = true; });
  build();
  buildChests();
  maybeShowIntro();
  // ?debug exposes the state for testing in the console
  if (new URLSearchParams(location.search).has("debug")) window.__game = { get S() { return S; }, get SK() { return SK; }, get amb() { return amb; }, setSkin, welcomeBack, sfx, get audio() { return actx && actx.state; }, openChest, renderCards, update, offline, tap, maybeShowIntro, openFinale, finish };
  requestAnimationFrame(frame);
  // offline support for the home-screen app (http(s) only; file:// can't register one)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
