<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grizzle's Haunted Mall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --moss: #22362c;
    --moss-deep: #182820;
    --plum: #3b2748;
    --plum-edge: #6b4a7c;
    --gold: #f2b632;
    --gold-dark: #b8841a;
    --slime: #9be15d;
    --ink: #f4ebd9;
    --ink-dim: #b9b3c4;
    --beer: #e8923a;
    --danger: #ff7a6b;
    --radius: 14px;
    --display: "Bagel Fat One", "Trebuchet MS", sans-serif;
    --body: "Figtree", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 500px at 50% -10%, #34503f 0%, transparent 70%),
      var(--moss);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }

  /* Header: the cash counter is the one loud thing */
  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; padding: 8px 0 16px; }
  .brand { flex: 1 1 260px; }
  .brand h1 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0; color: var(--ink-dim); letter-spacing: 0.02em; }
  .cash { font-family: var(--display); font-size: clamp(2.6rem, 9vw, 4.6rem); line-height: 1; color: var(--gold); text-shadow: 0 3px 0 var(--gold-dark); margin: 4px 0 0; }
  .cash small { font-size: 0.45em; color: var(--gold-dark); text-shadow: none; margin-left: 6px; }
  .hint { margin: 8px 0 0; padding: 8px 12px; max-width: 34ch; background: var(--gold); color: #2a1c00; font-weight: 600; border-radius: 12px; font-size: 0.95rem; }
  .stats { display: flex; gap: 20px; flex-wrap: wrap; color: var(--ink-dim); font-size: 0.95rem; }
  .stats b { color: var(--ink); font-weight: 700; }
  .stats .beer b { color: var(--beer); }

  .layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } }

  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--ink-dim); font-size: 0.95rem; }
  .seg { display: inline-flex; border: 2px solid var(--plum-edge); border-radius: 999px; overflow: hidden; }
  .seg button { background: transparent; border: 0; padding: 4px 14px; font-weight: 600; color: var(--ink-dim); }
  .seg button[aria-pressed="true"] { background: var(--plum-edge); color: var(--ink); }

  /* Shop signs */
  .signs { display: flex; flex-direction: column; gap: 14px; }
  .sign {
    --hue: 100;
    position: relative;
    background: var(--plum);
    border: 3px solid var(--plum-edge);
    border-radius: var(--radius);
    padding: 12px 14px 14px;
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 4px 12px;
    box-shadow: 0 6px 0 var(--moss-deep);
  }
  /* hanging chains */
  .sign::before, .sign::after {
    content: ""; position: absolute; top: -13px; width: 4px; height: 12px; background: var(--plum-edge); border-radius: 2px;
  }
  .sign::before { left: 26px; }
  .sign::after { right: 26px; }
  .sign.locked { opacity: 0.55; grid-template-columns: 60px 1fr; }
  .icon {
    grid-row: span 3; width: 60px; height: 60px; border-radius: 12px; border: 0;
    font-size: 2rem; display: grid; place-items: center;
    /* raised, brightly colored so it reads as a button like Buy and Automate */
    background: hsl(var(--hue) 70% 58%);
    box-shadow: 0 4px 0 hsl(var(--hue) 65% 30%), inset 0 2px 0 rgba(255, 255, 255, 0.3);
    cursor: pointer;
    transition: transform 80ms, box-shadow 80ms;
    align-self: start;
    margin-bottom: 4px;
  }
  .icon:hover:not(:disabled) { background: hsl(var(--hue) 75% 64%); }
  .icon:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 hsl(var(--hue) 65% 30%), inset 0 2px 0 rgba(255, 255, 255, 0.3); }
  /* automated or locked: nothing to tap, so it looks flat and quiet */
  .icon:disabled { cursor: default; background: hsl(var(--hue) 25% 30%); box-shadow: inset 0 -4px 0 hsl(var(--hue) 25% 20%); filter: saturate(0.7); }
  .sign h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.15rem; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .sign h3 .n { color: var(--gold); font-size: 1rem; white-space: nowrap; }
  /* phones: shop name on its own line, customer count underneath */
  @media (max-width: 560px) { .sign h3 { flex-direction: column; align-items: flex-start; gap: 0; } }
  .bar { cursor: pointer; height: 18px; background: var(--moss-deep); border-radius: 999px; overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: hsl(var(--hue) 65% 55%); border-radius: 999px; }
  .bar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; grid-column: 2; }
  .meta .info { font-size: 0.85rem; color: var(--ink-dim); flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .meta .info b { color: var(--ink); }
  /* progress toward the next milestone */
  .mbar { height: 6px; max-width: 220px; margin-top: 5px; background: var(--moss-deep); border-radius: 999px; overflow: hidden; }
  .mbar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
  .buys { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--gold); color: #2a1c00; border: 0; border-radius: 10px; padding: 7px 12px; font-weight: 700;
    box-shadow: 0 3px 0 var(--gold-dark); transition: transform 80ms, box-shadow 80ms;
  }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--gold-dark); }
  /* Raised buttons move down 3-4px when pressed. Stretch the hit area over the ledge below and the gap left above,
     so a press anywhere on what looks like the button lands on it; child spans never become the press target. */
  .btn, .icon { position: relative; }
  .btn::after, .icon::after { content: ""; position: absolute; inset: -4px 0; }
  .btn > *, .icon > * { pointer-events: none; }
  .btn:disabled { background: #5a4e66; color: #a79fb3; box-shadow: 0 3px 0 #40364b; cursor: not-allowed; }
  .btn.alt { background: var(--slime); box-shadow: 0 3px 0 #5f9a30; color: #12250a; }
  .btn.alt:disabled { background: #4c5a4f; color: #9aa89d; box-shadow: 0 3px 0 #38443a; }
  .btn .sub { display: block; font-size: 0.75rem; font-weight: 600; opacity: 0.8; }
  .btn.buy .sub { font-weight: 700; opacity: 1; }
  /* what a purchase adds; the corner badge marks purchases that cross a milestone */
  .btn .gain { display: block; font-size: 0.72rem; font-weight: 600; opacity: 0.8; white-space: nowrap; }
  .btn .badge {
    position: absolute; top: -9px; right: -7px; background: var(--slime); color: #12250a; border-radius: 999px;
    padding: 0 6px; font-size: 0.72rem; font-weight: 700; line-height: 1.5; box-shadow: 0 2px 0 #5f9a30;
  }
  .btn:disabled .badge { background: #8fb86d; box-shadow: 0 2px 0 #4c6e38; }
  .auto-tag { color: var(--slime); font-weight: 700; font-size: 0.9rem; }
  .locked-msg { grid-column: 2; color: var(--ink-dim); margin: 0; }

  /* Side panel */
  aside { display: flex; flex-direction: column; gap: 16px; }
  .panel { background: var(--plum); border: 3px solid var(--plum-edge); border-radius: var(--radius); padding: 14px; }
  .panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin: 0 0 8px; }
  .goal { margin: 0 0 10px; }
  .goal .gbar { height: 8px; background: var(--moss-deep); border-radius: 999px; margin-top: 4px; overflow: hidden; }
  .goal .gbar i { display: block; height: 100%; background: var(--slime); }
  .goal .label { font-size: 0.92rem; display: flex; justify-content: space-between; gap: 8px; }
  .goal .label span:last-child { color: var(--ink-dim); white-space: nowrap; }
  .panel p { margin: 0 0 10px; font-size: 0.92rem; color: var(--ink-dim); }
  .panel p b { color: var(--ink); }
  .finale .btn { width: 100%; padding: 10px; }
  .small-btn { background: transparent; border: 2px solid var(--plum-edge); border-radius: 10px; padding: 4px 10px; color: var(--ink-dim); font-size: 0.85rem; }
  .small-btn:hover { color: var(--ink); border-color: var(--ink-dim); }

  /* Cards and chests */
  .views { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .views .seg button { padding: 6px 18px; }
  .views .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-left: 6px; vertical-align: middle; }
  .chests { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .chest { background: var(--plum); border: 3px solid var(--plum-edge); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .chest h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.05rem; }
  .chest p { margin: 0; font-size: 0.85rem; color: var(--ink-dim); flex: 1; }
  .pull { min-height: 64px; margin-bottom: 14px; padding: 10px 12px; border: 2px dashed var(--plum-edge); border-radius: var(--radius); color: var(--ink-dim); font-size: 0.92rem; }
  .pull ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .pull li { background: var(--moss-deep); border-radius: 999px; padding: 4px 12px; color: var(--ink); font-weight: 600; }
  .pull li em { font-style: normal; color: var(--gold); margin-left: 6px; }
  .cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { --hue: 100; background: var(--plum); border: 3px solid var(--plum-edge); border-radius: var(--radius); padding: 12px; display: grid; grid-template-columns: 56px 1fr; gap: 4px 12px; align-content: start; }
  .card.none { opacity: 0.6; }
  .card.max { border-color: var(--gold); }
  .card .portrait { grid-row: span 2; width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-size: 1.9rem; background: hsl(var(--hue) 45% 26%); box-shadow: inset 0 -4px 0 hsl(var(--hue) 45% 18%); }
  .card h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.05rem; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
  .card h3 .lv { color: var(--gold); font-size: 0.95rem; white-space: nowrap; }
  .card .role { font-size: 0.82rem; color: var(--ink-dim); }
  .card .copies { grid-column: 1 / -1; }
  .card .copies .gbar { height: 8px; background: var(--moss-deep); border-radius: 999px; overflow: hidden; }
  .card .copies .gbar i { display: block; height: 100%; background: hsl(var(--hue) 65% 55%); }
  .card .copies span { font-size: 0.8rem; color: var(--ink-dim); }
  .card .perk { grid-column: 1 / -1; font-size: 0.88rem; margin: 0; }
  .card .perk b { color: var(--slime); }
  .card .perk small { display: block; color: var(--ink-dim); font-size: 0.8rem; }

  dialog#story { border: 3px solid var(--plum-edge); border-radius: var(--radius); background: var(--plum); color: var(--ink); padding: 20px 22px; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-x: hidden; overflow-y: auto; overflow-wrap: anywhere; box-shadow: 0 8px 0 var(--moss-deep); }
  dialog#story::backdrop { background: rgba(10, 20, 15, 0.72); }
  dialog#story h2 { font-family: var(--display); font-weight: 400; font-size: 1.4rem; margin: 0 0 10px; color: var(--gold); }
  dialog#story p { margin: 0 0 10px; line-height: 1.55; }
  dialog#story b { color: var(--gold); }
  .story-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 30px); opacity: 0;
    background: var(--gold); color: #2a1c00; font-weight: 700; padding: 10px 16px; border-radius: 12px;
    max-width: calc(100vw - 32px); text-align: center; transition: opacity 200ms, transform 200ms; pointer-events: none;
    box-shadow: 0 4px 0 var(--gold-dark);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .pop { position: fixed; pointer-events: none; font-family: var(--display); color: var(--gold); text-shadow: 0 2px 0 var(--gold-dark); animation: pop 800ms ease-out forwards; z-index: 5; }
  @keyframes pop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }
  @media (prefers-reduced-motion: reduce) {
    .pop { animation: none; opacity: 0; }
    .toast, .btn, .icon { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="episodeName">Grizzle's Haunted Mall</h1>
      <div class="cash" id="cash">$0</div>
      <p class="hint" id="hint" hidden></p>
    </div>
    <div class="stats">
      <span>Income <b id="ips">$0/s</b></span>
      <span class="beer">Beer <b id="beer">0</b></span>
      <span>Eggs <b id="eggs">0</b></span>
      <span>Crystals <b id="crystals">0</b></span>
      <span>Permanent bonus <b id="perm">x1</b></span>
    </div>
  </header>

  <div class="layout">
    <main>
      <div class="views">
        <div class="seg" role="group" aria-label="View">
          <button data-view="shops" aria-pressed="true">Shops</button>
          <button data-view="cards" aria-pressed="false">Cards<i class="dot" id="cardDot" hidden></i></button>
        </div>
        <div class="toolbar" id="buyBar">
          <span>Buy</span>
          <div class="seg" role="group" aria-label="Buy amount">
            <button data-mode="1" aria-pressed="true">x1</button>
            <button data-mode="10" aria-pressed="false">x10</button>
            <button data-mode="max" aria-pressed="false">Max</button>
          </div>
        </div>
      </div>
      <div class="signs" id="signs"></div>
      <section id="cardsView" hidden aria-label="Cards and chests">
        <div class="chests" id="chests"></div>
        <div class="pull" id="pull" aria-live="polite">Open a chest to draw cards. Duplicates level a card up.</div>
        <div class="cardgrid" id="cardgrid"></div>
      </section>
    </main>

    <aside>
      <section class="panel" aria-labelledby="goalsH">
        <h2 id="goalsH">Goals</h2>
        <div id="goals"></div>
        <p id="goalsNote"></p>
      </section>
      <section class="panel finale" aria-labelledby="finH">
        <h2 id="finH">Episode finale</h2>
        <p id="finText"></p>
        <button class="btn alt" id="finBtn" disabled>Locked</button>
      </section>
      <section class="panel">
        <p id="offlineNote">Your shops keep earning while the tab is closed.</p>
        <button class="small-btn" id="resetBtn">Wipe save</button>
      </section>
    </aside>
  </div>
</div>
<dialog id="story" aria-labelledby="storyTitle">
  <h2 id="storyTitle"></h2>
  <div id="storyText"></div>
  <div class="story-actions" id="storyActions"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  // ---------- Content (all placeholder, tune freely) ----------
  // The numbers behind the six shop slots. Names, icons and story per episode live in EPISODES below.
  const SCHEMES = [
    { hue: 35,  base: 4,       growth: 1.07, payout: 1,      time: 1,  auto: 500 },
    { hue: 275, base: 60,      growth: 1.15, payout: 60,     time: 3,  auto: 5e3 },
    { hue: 320, base: 1000,    growth: 1.14, payout: 540,    time: 6,  auto: 5e4 },
    { hue: 190, base: 20000,   growth: 1.13, payout: 4320,   time: 12, auto: 5e5 },
    { hue: 210, base: 300000,  growth: 1.12, payout: 51840,  time: 24, auto: 5e6 },
    { hue: 10,  base: 4000000, growth: 1.11, payout: 622080, time: 96, auto: 5e7 },
  ];
  const MILESTONES = [10, 25, 50, 100, 150];   // each doubles that scheme's income and gives 1 beer
  const PERM_PER_EPISODE = 0.5;                 // +50% per finished episode (Bramble boosts this)
  const EPISODE_COST_STEP = 2;                  // costs x(1 + 2 per finished episode): customers, automation, cash goals
  const OFFLINE_CAP_S = 8 * 3600;               // shops earn for at most this long while the tab is closed

  // Cards: permanent, survive episode resets. Copies needed for levels 1..5 (cumulative).
  // Each card is one multiplier; per is its strength per level (see the Math section for how each one applies).
  const LEVEL_AT = [1, 3, 6, 11, 19];
  const MAX_LEVEL = LEVEL_AT.length;
  const CARDS = [
    { id: "grizzle", name: "Grizzle", role: "Scrappy owner",       icon: "👺", hue: 100, weight: 30, per: 0.1,
      perk: l => `All income x${(1 + 0.1 * l).toFixed(1)}` },
    { id: "mort",    name: "Mort",    role: "Night-shift ghoul",   icon: "🧟", hue: 160, weight: 25, per: 0.1,
      perk: l => `Shops run x${(1 + 0.1 * l).toFixed(1)} faster` },
    { id: "vex",     name: "Countess Vex", role: "Vampire bookkeeper", icon: "🧛", hue: 340, weight: 20, per: 0.04,
      perk: l => `Customers and automation ${Math.round(4 * l)}% cheaper` },
    { id: "bramble", name: "Bramble", role: "Bouncer and collector", icon: "🧌", hue: 30, weight: 15, per: 0.2,
      perk: l => `Finale bonus +${Math.round(PERM_PER_EPISODE * (1 + 0.2 * l) * 100)}%` },
    { id: "witch",   name: "Old Bog Witch", role: "Rival across the street", icon: "🧙", hue: 285, weight: 10, per: 0.05,
      perk: l => `Milestones multiply income x${(2 + 0.05 * l).toFixed(2)}` },
  ];
  const CHESTS = [
    { id: "egg",    name: "Egg chest",     cur: "eggs",     cost: 2,  pulls: 3, blurb: "Eggs come from clearing goals and finishing episodes." },
    { id: "beer",   name: "Beer chest",    cur: "beer",     cost: 5,  pulls: 2, blurb: "Beer comes from shop milestones." },
    { id: "barrel", name: "Crystal barrel", cur: "crystals", cost: 12, pulls: 4, blurb: "Crystals come from duplicates of maxed cards." },
  ];
  const EGGS_PER_GOAL = 1, EGGS_PER_FINALE = 3;
  // Episodes repeat after the last one (shown as "Haunted Mall 2" and so on), with the permanent bonus carrying over.
  // shops[i] fills SCHEMES[i]: noun is used in goal text ("Own 25 pretzel customers"), lease is the last shop's name in short.
  const EPISODES = [
    {
      name: "Haunted Mall",
      lease: "dragon lease",
      shops: [
        { name: "Pretzel kiosk of mystery",   icon: "🥨", noun: "pretzel" },
        { name: "Cursed phone-case cart",     icon: "📱", noun: "phone-case" },
        { name: "Love-potion perfume counter", icon: "🧪", noun: "perfume" },
        { name: "Haunted arcade",             icon: "🕹️", noun: "arcade" },
        { name: "Elevator-to-nowhere toll",   icon: "🛗", noun: "elevator" },
        { name: "Dragon anchor-store lease",  icon: "🐉", noun: "dragon" },
      ],
      intro: {
        text: [
          "The mall closed in 1994. Nobody told the ghosts, the goblins, or Grizzle.",
          "Grizzle has a pretzel kiosk, a dream, and a lease that says AS-IS in very large letters. Mort has the night shift and no complaints. Countess Vex is doing the books, in a manner of speaking.",
          "Sell something. Anything.",
        ],
      },
      finale: {
        title: "The big switch",
        text: [
          "Every shop is humming. The Old Bog Witch has been outbid, and a dragon has signed a lease on the whole east wing, food court included.",
          "That leaves the mall's main breaker. Bramble is standing next to it. \"Boss,\" says Bramble, \"this is a bad idea.\" \"That's why it'll work,\" says Grizzle.",
          "The lights go out. The profits do not.",
        ],
        ready: "Bramble is standing by the big switch.",
        button: "Cut the mall's power",
      },
    },
    {
      name: "Swamp Market",
      lease: "ferry monopoly",
      shops: [
        { name: "Mushroom stall of mystery",   icon: "🍄", noun: "mushroom" },
        { name: "Bog-water bottler",           icon: "🫙", noun: "bottled-water" },
        { name: "Newt-eye lucky charms",       icon: "🧿", noun: "charm" },
        { name: "Fog boat tours",              icon: "🛶", noun: "boat tour" },
        { name: "Stilt-house timeshare",       icon: "🏚️", noun: "timeshare" },
        { name: "Kraken ferry monopoly",       icon: "🦑", noun: "ferry" },
      ],
      intro: {
        text: [
          "The Swamp Market opens at dusk and never closes, because nobody remembers where the doors are.",
          "Grizzle arrives with a crate of unsold pretzels and a reputation. The Old Bog Witch runs the stall across the way and has been expecting him. \"You again,\" she says.",
          "Countess Vex has already found the ledger. Mort has already found the swamp.",
        ],
      },
      finale: {
        title: "Anchors aweigh",
        text: [
          "The Witch offers a truce and a very small pie. Grizzle declines the pie. She takes this personally.",
          "So Bramble unhooks the market from its moorings, on purpose, with the kraken's blessing. The whole thing floats, and drifts downriver toward the next district.",
          "It smells like old stone and expensive candles.",
        ],
        ready: "The market is straining at its moorings.",
        button: "Cut the moorings",
      },
    },
    {
      name: "Crypt Quarter",
      lease: "mausoleum condo",
      shops: [
        { name: "Grave-flower cart",           icon: "🥀", noun: "flower" },
        { name: "Coffin showroom",             icon: "⚰️", noun: "coffin" },
        { name: "Seance parlor",               icon: "🔮", noun: "seance" },
        { name: "Ghost-tour desk",             icon: "👻", noun: "ghost tour" },
        { name: "Bone-china antiques",         icon: "🦴", noun: "antique" },
        { name: "Mausoleum condo sales",       icon: "🏛️", noun: "condo" },
      ],
      intro: {
        text: [
          "The Crypt Quarter is the oldest, quietest, most overpriced district in town. Nobody here pays in cash. Everyone pays in favors, and Countess Vex knows all of them.",
          "Grizzle opens a flower cart outside a family mausoleum. Nobody complains. Somehow that is the most worrying part.",
        ],
      },
      finale: {
        title: "Fine print",
        text: [
          "By dawn every mausoleum is a condo and every ghost has a timeshare. Then the Old Bog Witch turns up with an offer to buy the whole street.",
          "Grizzle laughs. She shows him the paperwork. Bramble reads it twice. \"Boss,\" says Bramble, \"we have a bigger problem.\"",
          "Somewhere in the distance, a mall reopens.",
        ],
        ready: "The Witch's paperwork is on your desk.",
        button: "Burn the paperwork",
      },
    },
  ];
  const SAVE_KEY = "grizzle-haunted-mall-v1";
  const SPEED = Math.max(1, Number(new URLSearchParams(location.search).get("speed")) || 1); // ?speed=10 for testing

  // Listed roughly in the order a player reaches them; the first three uncleared ones are shown.
  // {n} in the text is filled with that shop's noun for the current episode, {$} with the target as money.
  // scaled goals grow with episode costs (see costMult). The finale also needs the last shop (see finaleReady).
  const GOALS = [
    { id: "h1", text: "Own 25 {0} customers",       cur: s => s.schemes[0].n, target: 25 },
    { id: "h2", text: "Own 10 {2} customers",       cur: s => s.schemes[2].n, target: 10 },
    { id: "h3", text: "Automate 3 shops",               cur: s => s.schemes.filter((x, i) => isAuto(i)).length, target: 3 },
    { id: "h4", text: "Own 25 {3} customers",        cur: s => s.schemes[3].n, target: 25 },
    { id: "h5", text: "Own 10 {4} customers",      cur: s => s.schemes[4].n, target: 10 },
    { id: "h6", text: "Hold {$} at once",               cur: s => s.cash, target: 3e6, scaled: true },
    { id: "h7", text: "Own 50 {3} customers",        cur: s => s.schemes[3].n, target: 50 },
    { id: "h8", text: "Own 25 {4} customers",      cur: s => s.schemes[4].n, target: 25 },
    { id: "h9", text: "Automate 5 shops",               cur: s => s.schemes.filter((x, i) => isAuto(i)).length, target: 5 },
  ];
  const GOALS_NEEDED = 5;

  // ---------- State ----------
  const fresh = () => ({
    cash: 0, beer: 0, eggs: 0, crystals: 0, cards: {}, cardsV2: true, episode: 0, storySeen: -1, perm: 1, goalsDone: [],
    schemes: SCHEMES.map((_, i) => ({ n: i === 0 ? 1 : 0, auto: false, running: false, progress: 0 })),
    seen: Date.now(),
  });
  let S = load() || fresh();
  const PREF_KEY = "grizzle-haunted-mall-buymode";
  let buyMode = (() => { try { const m = localStorage.getItem(PREF_KEY); return ["1", "10", "max"].includes(m) ? m : "1"; } catch { return "1"; } })();

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !Array.isArray(s.schemes) || s.schemes.length !== SCHEMES.length) return null;
      // saves from before cards existed
      s.eggs = s.eggs || 0; s.crystals = s.crystals || 0; s.cards = s.cards || {};
      // saves from before the story existed count as having read the current intro
      if (typeof s.storySeen !== "number") s.storySeen = s.episode || 0;
      // saves from when Mort ran the first shops for free keep those shops automated
      if (!s.cardsV2) {
        const mort = LEVEL_AT.filter(c => (s.cards.mort || 0) >= c).length;
        s.schemes.forEach((sc, i) => { if (i < mort && sc.n > 0) sc.auto = true; });
        s.cardsV2 = true;
      }
      return s;
    } catch { return null; }
  }
  function save() {
    try { S.seen = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {}
  }

  // ---------- Episode content ----------
  const EP = () => EPISODES[S.episode % EPISODES.length];
  const shop = i => EP().shops[i];
  const goalText = g => g.text.replace(/\{(\d)\}/g, (m, i) => shop(i).noun).replace("{$}", () => money(goalTarget(g)));

  // ---------- Math ----------
  const copies = id => S.cards[id] || 0;
  const cardLevel = id => LEVEL_AT.filter(c => copies(id) >= c).length;
  const cardBonus = id => CARDS.find(c => c.id === id).per * cardLevel(id);   // e.g. 0.3 at level 3 of a 0.1 card
  const milestoneMult = n => Math.pow(2 + cardBonus("witch"), MILESTONES.filter(m => n >= m).length);
  const globalMult = () => S.perm * (1 + cardBonus("grizzle"));
  const runTime = i => SCHEMES[i].time / (1 + cardBonus("mort"));
  const discount = () => 1 - cardBonus("vex");
  const isAuto = i => S.schemes[i].auto;
  const offlineCap = () => OFFLINE_CAP_S;
  const finaleGain = () => PERM_PER_EPISODE * (1 + cardBonus("bramble"));
  const incomeAt = (i, n) => n * SCHEMES[i].payout * milestoneMult(n) * globalMult();   // one run with n customers
  const runIncome = i => incomeAt(i, S.schemes[i].n);
  const perSecond = i => S.schemes[i].n ? runIncome(i) / runTime(i) : 0;
  const costMult = () => 1 + EPISODE_COST_STEP * S.episode;
  const goalTarget = g => g.target * (g.scaled ? costMult() : 1);
  const autoCost = i => SCHEMES[i].auto * costMult() * discount();
  const nextCost = i => SCHEMES[i].base * costMult() * discount() * Math.pow(SCHEMES[i].growth, S.schemes[i].n);
  function bulkCost(i, k) {
    const r = SCHEMES[i].growth;
    return nextCost(i) * (Math.pow(r, k) - 1) / (r - 1);
  }
  function maxAffordable(i) {
    const r = SCHEMES[i].growth;
    const k = Math.floor(Math.log(1 + S.cash * (r - 1) / nextCost(i)) / Math.log(r));
    return Math.max(0, k);
  }
  function buyCount(i) {
    if (buyMode === "max") return Math.max(1, maxAffordable(i));
    return Number(buyMode);
  }

  const SUFFIX = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
  function fmt(v) {
    if (!isFinite(v)) return "∞";
    if (v < 1000) return v < 10 && v % 1 ? v.toFixed(2).replace(/0$/, "") : Math.floor(v).toString();
    const t = Math.min(Math.floor(Math.log10(v) / 3), SUFFIX.length - 1);
    const x = v / Math.pow(1000, t);
    return (x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2)) + SUFFIX[t];
  }
  const money = v => "$" + fmt(v);
  // Rewriting a button's contents mid-press drops the click, so per-frame updates only write when something changed.
  const setHTML = (el, html) => { if (el._html !== html) { el._html = html; el.innerHTML = html; } };
  const fmtTime = s => s < 10 ? +s.toFixed(1) + "s" : s < 60 ? Math.round(s) + "s" : Math.round(s / 60) + "m";

  // ---------- Actions ----------
  function unlocked(i) { return i === 0 || S.schemes[i - 1].n >= 1; }

  function buy(i) {
    const k = buyCount(i);
    const cost = bulkCost(i, k);
    if (S.cash < cost) return;
    const before = S.schemes[i].n;
    S.cash -= cost;
    S.schemes[i].n += k;
    const crossed = MILESTONES.filter(m => before < m && S.schemes[i].n >= m).length;
    if (crossed) {
      S.beer += crossed;
      toast(shop(i).name + ": income x" + Math.pow(2, crossed) + " and +" + crossed + " beer");
    }
    render();
  }
  function automate(i) {
    const sc = S.schemes[i];
    if (isAuto(i) || S.cash < autoCost(i) || sc.n < 1) return;
    S.cash -= autoCost(i);
    sc.auto = true;
    if (!sc.running) sc.running = true;
    render();
  }
  function tap(i, ev) {
    const sc = S.schemes[i];
    if (sc.n < 1 || isAuto(i) || sc.running) return;
    sc.running = true;
  }

  // ---------- Chests ----------
  function pickCard() {
    const total = CARDS.reduce((a, c) => a + c.weight, 0);
    let roll = Math.random() * total;
    for (const c of CARDS) { roll -= c.weight; if (roll < 0) return c; }
    return CARDS[0];
  }
  function openChest(id) {
    const ch = CHESTS.find(c => c.id === id);
    if (!ch || S[ch.cur] < ch.cost) return;
    S[ch.cur] -= ch.cost;
    const got = [];
    for (let k = 0; k < ch.pulls; k++) {
      const c = pickCard();
      const before = cardLevel(c.id);
      if (copies(c.id) >= LEVEL_AT[MAX_LEVEL - 1]) { S.crystals += 1; got.push({ c, tag: "+1 crystal" }); continue; }
      S.cards[c.id] = copies(c.id) + 1;
      const after = cardLevel(c.id);
      got.push({ c, tag: before === 0 ? "new" : after > before ? "level " + after : "" });
    }
    S.schemes.forEach((sc, i) => { if (isAuto(i) && sc.n > 0) sc.running = true; });
    $("pull").innerHTML = "<ul>" + got.map(g => `<li>${g.c.icon} ${g.c.name}${g.tag ? `<em>${g.tag}</em>` : ""}</li>`).join("") + "</ul>";
    renderCards();
    render();
  }

  // only count goals that still exist, so saves from older goal lists don't inflate it
  const clearedCount = () => GOALS.filter(g => S.goalsDone.includes(g.id)).length;
  function finaleReady() {
    return clearedCount() >= GOALS_NEEDED && S.schemes[SCHEMES.length - 1].n >= 1;
  }
  function finish() {
    if (!finaleReady()) return;
    const next = fresh();
    next.episode = S.episode + 1;
    next.perm = S.perm + finaleGain();
    next.beer = S.beer;
    next.eggs = S.eggs + EGGS_PER_FINALE;
    next.crystals = S.crystals;
    next.cards = S.cards;
    S = next;
    save();
    build();
    maybeShowIntro();
  }
  const nameOf = ep => EPISODES[ep % EPISODES.length].name + (ep >= EPISODES.length ? " " + (Math.floor(ep / EPISODES.length) + 1) : "");
  const episodeName = () => nameOf(S.episode);

  // ---------- Story ----------
  function showStory({ title, text, actions }) {
    $("storyTitle").textContent = title;
    $("storyText").innerHTML = text.map(t => "<p>" + t + "</p>").join("");
    const box = $("storyActions");
    box.innerHTML = "";
    actions.forEach((a, k) => {
      const b = document.createElement("button");
      b.className = k === 0 ? "btn alt" : "small-btn";
      b.textContent = a.label;
      b.addEventListener("click", () => { $("story").close(); if (a.run) a.run(); });
      box.appendChild(b);
    });
    $("story").showModal();
    box.firstChild.focus();
  }
  function maybeShowIntro() {
    if (S.storySeen >= S.episode) return;
    S.storySeen = S.episode;
    save();
    showStory({
      title: "Episode " + (S.episode + 1) + ": " + episodeName(),
      text: EP().intro.text,
      actions: [{ label: "Open for business" }],
    });
  }
  function openFinale() {
    if (!finaleReady()) return;
    const f = EP().finale;
    showStory({
      title: f.title,
      text: f.text.concat(["<b>Reward:</b> +" + Math.round(finaleGain() * 100) + "% permanent income and " + EGGS_PER_FINALE + " eggs. Next stop: " + nameOf(S.episode + 1) + "."]),
      actions: [{ label: "Start " + nameOf(S.episode + 1), run: finish }, { label: "Not yet" }],
    });
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1) * SPEED;
    last = now;
    for (let i = 0; i < SCHEMES.length; i++) {
      const sc = S.schemes[i];
      const auto = isAuto(i);
      if (auto && !sc.running && sc.n >= 1) sc.running = true;
      if (!sc.running || sc.n < 1) continue;
      sc.progress += dt / runTime(i);
      if (sc.progress >= 1) {
        const runs = auto ? Math.floor(sc.progress) : 1;
        S.cash += runIncome(i) * runs;
        sc.progress = auto ? sc.progress - runs : 0;
        sc.running = auto;
      }
    }
    checkGoals();
    update();
    requestAnimationFrame(frame);
  }

  function checkGoals() {
    for (const g of GOALS) {
      if (!S.goalsDone.includes(g.id) && g.cur(S) >= goalTarget(g)) {
        S.goalsDone.push(g.id);
        S.eggs += EGGS_PER_GOAL;
        toast("Goal cleared: " + goalText(g) + " (+" + EGGS_PER_GOAL + " egg)");
        renderGoals();
      }
    }
  }

  // ---------- Offline ----------
  function offline() {
    const secs = Math.min((Date.now() - (S.seen || Date.now())) / 1000, offlineCap());
    if (secs < 30) return;
    let gain = 0;
    SCHEMES.forEach((_, i) => { if (isAuto(i)) gain += perSecond(i) * secs; });
    if (gain > 0) {
      S.cash += gain;
      toast("Welcome back. Your shops earned " + money(gain) + " in " + (secs >= 3600 ? (secs / 3600).toFixed(1) + " hours" : Math.round(secs / 60) + " minutes"));
    }
  }

  // ---------- Rendering ----------
  const $ = id => document.getElementById(id);
  const signsEl = $("signs");
  let rows = [];

  function build() {
    $("episodeName").textContent = document.title = "Grizzle's " + episodeName();
    signsEl.innerHTML = "";
    rows = SCHEMES.map((sc, i) => {
      const el = document.createElement("article");
      el.className = "sign";
      el.style.setProperty("--hue", sc.hue);
      el.innerHTML = `
        <button class="icon" aria-label="Run ${shop(i).name}"></button>
        <h3><span class="nm"></span><span class="n"></span></h3>
        <div class="bar"><i></i><span></span></div>
        <div class="meta">
          <div class="info"></div>
          <div class="buys">
            <button class="btn buy"></button>
            <button class="btn alt auto"></button>
          </div>
        </div>
        <p class="locked-msg" hidden></p>`;
      signsEl.appendChild(el);
      const r = {
        el, icon: el.querySelector(".icon"), nm: el.querySelector(".nm"), n: el.querySelector(".n"),
        fill: el.querySelector(".bar i"), label: el.querySelector(".bar span"), info: el.querySelector(".info"),
        buy: el.querySelector(".buy"), auto: el.querySelector(".auto"), locked: el.querySelector(".locked-msg"),
        meta: el.querySelector(".meta"), bar: el.querySelector(".bar"),
      };
      r.icon.addEventListener("click", ev => tap(i, ev));
      r.bar.addEventListener("click", ev => tap(i, ev));
      r.bar.setAttribute("role", "button");
      r.bar.tabIndex = 0;
      r.bar.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); tap(i, ev); } });
      r.buy.addEventListener("click", () => buy(i));
      r.auto.addEventListener("click", () => automate(i));
      return r;
    });
    renderGoals();
    renderCards();
    render();
  }

  // ---------- Cards view ----------
  function buildChests() {
    $("chests").innerHTML = CHESTS.map(c => `
      <div class="chest">
        <h3>${c.name}</h3>
        <p>${c.blurb} Draws ${c.pulls} cards.</p>
        <button class="btn alt" data-chest="${c.id}">Open<span class="sub">${c.cost} ${c.cur}</span></button>
      </div>`).join("");
    $("chests").querySelectorAll("[data-chest]").forEach(b => b.addEventListener("click", () => openChest(b.dataset.chest)));
  }
  function updateChests() {
    let any = false;
    CHESTS.forEach(c => {
      const b = document.querySelector(`[data-chest="${c.id}"]`);
      if (!b) return;
      const can = S[c.cur] >= c.cost;
      b.disabled = !can;
      any = any || can;
    });
    $("cardDot").hidden = !any;
  }
  function renderCards() {
    $("cardgrid").innerHTML = CARDS.map(c => {
      const n = copies(c.id), lv = cardLevel(c.id), max = lv >= MAX_LEVEL;
      const lo = lv ? LEVEL_AT[lv - 1] : 0, hi = max ? lo : LEVEL_AT[lv];
      const pct = max ? 100 : ((n - lo) / (hi - lo)) * 100;
      const now = lv ? c.perk(lv) : "Not found yet";
      const next = max ? "Max level" : `Next: ${c.perk(lv + 1)}`;
      return `<article class="card${lv ? "" : " none"}${max ? " max" : ""}" style="--hue:${c.hue}">
        <div class="portrait">${lv ? c.icon : "❔"}</div>
        <h3><span>${c.name}</span><span class="lv">${lv ? "Level " + lv : ""}</span></h3>
        <div class="role">${c.role}</div>
        <div class="copies"><div class="gbar"><i style="width:${pct}%"></i></div><span>${max ? n + " copies" : `${n} of ${hi} copies`}</span></div>
        <p class="perk"><b>${now}</b><small>${next}</small></p>
      </article>`;
    }).join("");
  }

  function renderGoals() {
    const active = GOALS.filter(g => !S.goalsDone.includes(g.id)).slice(0, 3);
    $("goals").innerHTML = active.map(g => {
      const target = goalTarget(g), cur = Math.min(g.cur(S), target);
      return `<div class="goal" data-id="${g.id}"><div class="label"><span>${goalText(g)}</span><span>${fmt(cur)} / ${fmt(target)}</span></div><div class="gbar"><i style="width:${(cur / target) * 100}%"></i></div></div>`;
    }).join("") || "<p>All goals cleared.</p>";
    $("goalsNote").innerHTML = `Cleared <b>${clearedCount()}</b> of the <b>${GOALS_NEEDED}</b> needed to open the finale.`;
  }

  function render() {
    S.schemes.forEach((sc, i) => {
      const r = rows[i], def = SCHEMES[i];
      const open = unlocked(i);
      r.el.classList.toggle("locked", !open);
      r.nm.textContent = open ? shop(i).name : "Locked shop";
      r.icon.textContent = open ? shop(i).icon : "🔒";
      r.icon.disabled = !open || isAuto(i);
      r.meta.hidden = r.bar.hidden = !open;
      r.locked.hidden = open;
      r.locked.textContent = open ? "" : "Open one " + shop(i - 1).name.toLowerCase() + " customer to unlock.";
      r.n.textContent = open ? sc.n + " customers" : "";
    });
    update(true);
  }

  // cheap per-frame update: bars, cash, button states
  function update(force) {
    $("cash").textContent = money(S.cash);
    $("beer").textContent = S.beer;
    $("eggs").textContent = S.eggs;
    $("crystals").textContent = S.crystals;
    $("perm").textContent = "x" + S.perm.toFixed(1);
    $("offlineNote").textContent = "Your shops keep earning while the tab is closed (up to " + offlineCap() / 3600 + " hours).";
    updateChests();
    const s0 = S.schemes[0];
    $("hint").textContent = "Tap the " + shop(0).name.toLowerCase() + " (the icon or its bar) to earn your first dollars. Every $1 gets you closer to a second customer.";
    $("hint").hidden = !(s0.n === 1 && !isAuto(0) && S.cash < nextCost(0) && S.episode === 0);
    let total = 0;
    S.schemes.forEach((sc, i) => {
      const r = rows[i], def = SCHEMES[i];
      if (!unlocked(i)) return;
      const auto = isAuto(i);
      if (auto) total += perSecond(i);
      const fast = auto && runTime(i) / SPEED < 0.25;
      r.fill.style.width = ((fast ? 1 : sc.progress) * 100) + "%";
      const income = runIncome(i);
      r.label.textContent = sc.n < 1 ? "Buy a customer to open" : auto ? money(perSecond(i)) + "/s" : (sc.running ? money(income) : "Tap to run: " + money(income));
      const k = buyCount(i), cost = bulkCost(i, k);
      const nextM = MILESTONES.find(m => m > sc.n);
      const prevM = MILESTONES.filter(m => m <= sc.n).pop() || 0;
      setHTML(r.info, `<span>Runs every <b>${fmtTime(runTime(i))}</b></span>`
        + (nextM ? `<span>Next bonus at <b>${nextM}</b> · ${nextM - sc.n} to go</span>` : "<span>All bonuses earned</span>")
        + `<span class="mbar"><i style="width:${nextM ? ((sc.n - prevM) / (nextM - prevM)) * 100 : 100}%"></i></span>`);
      // what this purchase adds: $/s once automated, per run while tapped by hand
      const added = incomeAt(i, sc.n + k) - income;
      const crossed = MILESTONES.filter(m => sc.n < m && sc.n + k >= m).length;
      const gain = "+" + (auto ? money(added / runTime(i)) + "/s" : money(added) + "/run");
      const badge = crossed ? `<span class="badge">x${+Math.pow(2 + cardBonus("witch"), crossed).toFixed(2)}</span>` : "";
      setHTML(r.buy, `Buy x${k}<span class="sub">${money(cost)}</span><span class="gain">${gain}</span>${badge}`);
      r.buy.disabled = S.cash < cost;
      if (auto) r.auto.hidden = true;
      else { r.auto.hidden = false; setHTML(r.auto, `Automate<span class="sub">${money(autoCost(i))}</span>`); r.auto.disabled = S.cash < autoCost(i) || sc.n < 1; }
      r.n.textContent = sc.n + " customers" + (auto ? " · auto" : "");
    });
    $("ips").textContent = money(total) + "/s";
    // finale
    const ready = finaleReady();
    const btn = $("finBtn");
    btn.disabled = !ready;
    const nextEp = nameOf(S.episode + 1);
    btn.textContent = ready ? EP().finale.button : "Locked";
    $("finText").innerHTML = ready
      ? `${EP().finale.ready} This resets your cash and shops, keeps your beer and cards, adds <b>+${Math.round(finaleGain() * 100)}%</b> permanent income and <b>${EGGS_PER_FINALE} eggs</b>, and moves you to the <b>${nextEp}</b>.`
      : "Still needed: " + [
          clearedCount() < GOALS_NEEDED ? `${GOALS_NEEDED - clearedCount()} more goal${GOALS_NEEDED - clearedCount() > 1 ? "s" : ""}` : "",
          S.schemes[SCHEMES.length - 1].n < 1 ? "a " + EP().lease : "",
        ].filter(Boolean).join(" and ") + ".";
    // refresh goal progress a few times a second, not every frame
    const t = Math.floor(performance.now() / 250);
    if (force || t !== update.t) { update.t = t; renderGoals(); }
  }

  let toastTimer;
  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
  }

  // ---------- Wiring ----------
  const showBuyMode = () => document.querySelectorAll("#buyBar .seg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === buyMode));
  document.querySelectorAll("#buyBar .seg button").forEach(b => b.addEventListener("click", () => {
    buyMode = b.dataset.mode;
    try { localStorage.setItem(PREF_KEY, buyMode); } catch {}
    showBuyMode();
    update(true);
  }));
  showBuyMode();
  const VIEW_KEY = "grizzle-haunted-mall-view";
  function setView(view) {
    const cards = view === "cards";
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x.dataset.view === (cards ? "cards" : "shops")));
    $("signs").hidden = cards;
    $("buyBar").hidden = cards;
    $("cardsView").hidden = !cards;
  }
  document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => {
    setView(b.dataset.view);
    try { localStorage.setItem(VIEW_KEY, b.dataset.view); } catch {}
  }));
  try { setView(localStorage.getItem(VIEW_KEY)); } catch { setView("shops"); }
  $("finBtn").addEventListener("click", openFinale);
  $("resetBtn").addEventListener("click", () => {
    if (confirm("Wipe your save and start over?")) {
      try { localStorage.removeItem(SAVE_KEY); } catch {}
      S = fresh(); build(); maybeShowIntro();
    }
  });
  addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { save(); return; }
    // browsers pause the game loop in background tabs, so credit the time away (S.seen was saved on hide)
    last = performance.now();
    offline();
    S.seen = Date.now();
    render();
  });
  setInterval(save, 5000);

  offline();
  // resume any automated shops
  S.schemes.forEach((sc, i) => { if (isAuto(i) && sc.n > 0) sc.running = true; });
  build();
  buildChests();
  maybeShowIntro();
  // ?debug exposes the state for testing in the console
  if (new URLSearchParams(location.search).has("debug")) window.__game = { get S() { return S; }, openChest, renderCards, update, offline, tap, maybeShowIntro, openFinale, finish };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
